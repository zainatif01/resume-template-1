<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zain Atif - JSON Resume Editor</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- JSON File Manager -->
    <div class="json-manager" id="jsonManager">
        <div class="json-controls">
            <div class="json-status">
                <i class="fas fa-file-code"></i>
                <span id="jsonStatus">resume-data.json</span>
            </div>
            <div class="json-actions">
                <button id="saveToFile" class="json-btn save-file">
                    <i class="fas fa-save"></i> Save to File
                </button>
                <label class="json-btn load-file">
                    <i class="fas fa-folder-open"></i> Load from File
                    <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
                </label>
                <button id="newJson" class="json-btn new-file">
                    <i class="fas fa-file"></i> New Resume
                </button>
                <button id="editJson" class="json-btn edit-json">
                    <i class="fas fa-code"></i> Edit JSON
                </button>
            </div>
        </div>
        
        <!-- JSON Editor (Hidden by default) -->
        <div class="json-editor hidden" id="jsonEditor">
            <div class="editor-header">
                <h3><i class="fas fa-code"></i> JSON Editor</h3>
                <button id="closeJsonEditor" class="close-editor">&times;</button>
            </div>
            <textarea id="jsonTextarea" spellcheck="false"></textarea>
            <div class="editor-actions">
                <button id="applyJson" class="editor-btn apply">Apply Changes</button>
                <button id="formatJson" class="editor-btn format">Format JSON</button>
                <button id="cancelJson" class="editor-btn cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Resume Container -->
    <div class="resume-container" id="resumeContainer">
        <!-- Resume content will be generated by JavaScript -->
    </div>

    <!-- Templates -->
    <template id="resumeTemplate">
        <header class="header">
            <div class="header-content">
                <div class="name-title">
                    <h1 class="editable" data-field="name">Loading...</h1>
                    <p class="subtitle editable" data-field="title">Loading...</p>
                </div>
                <div class="contact-info">
                    <p><i class="fas fa-envelope"></i> <span class="editable" data-field="email">Loading...</span></p>
                    <p><i class="fas fa-phone"></i> <span class="editable" data-field="phone">Loading...</span></p>
                    <p><i class="fas fa-map-marker-alt"></i> <span class="editable" data-field="location">Loading...</span></p>
                </div>
            </div>
        </header>

        <main class="resume-content">
            <div class="main-column">
                <section class="section" id="summarySection">
                    <div class="section-header">
                        <h2 class="section-title editable-section" data-field="summaryTitle">Professional Summary</h2>
                        <button class="add-btn" data-add="summaryParagraph"><i class="fas fa-plus"></i> Add Paragraph</button>
                    </div>
                    <div class="summary-content" id="summaryContent">
                        <!-- Summary paragraphs will be added here -->
                    </div>
                </section>

                <section class="section" id="experienceSection">
                    <div class="section-header">
                        <h2 class="section-title editable-section" data-field="experienceTitle">Work Experience</h2>
                        <button class="add-btn" data-add="experience"><i class="fas fa-plus"></i> Add Job</button>
                    </div>
                    <div class="experience-list" id="experienceList">
                        <!-- Experience items will be added here -->
                    </div>
                </section>

                <section class="section" id="skillsSection">
                    <div class="section-header">
                        <h2 class="section-title editable-section" data-field="skillsTitle">Skills</h2>
                        <button class="add-btn" data-add="skillCategory"><i class="fas fa-plus"></i> Add Category</button>
                    </div>
                    <div class="skills-grid" id="skillsGrid">
                        <!-- Skill categories will be added here -->
                    </div>
                </section>
            </div>

            <div class="sidebar">
                <section class="sidebar-section" id="languagesSection">
                    <div class="section-header">
                        <h3 class="sidebar-title editable-section" data-field="languagesTitle">Languages</h3>
                        <button class="add-btn small" data-add="language"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="language-list" id="languageList">
                        <!-- Languages will be added here -->
                    </div>
                </section>

                <section class="sidebar-section" id="educationSection">
                    <div class="section-header">
                        <h3 class="sidebar-title editable-section" data-field="educationTitle">Education</h3>
                        <button class="add-btn small" data-add="education"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="education-list" id="educationList">
                        <!-- Education items will be added here -->
                    </div>
                </section>

                <section class="sidebar-section" id="personalSection">
                    <div class="section-header">
                        <h3 class="sidebar-title editable-section" data-field="personalTitle">Personal Details</h3>
                        <button class="add-btn small" data-add="personal"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="personal-details" id="personalDetails">
                        <!-- Personal details will be added here -->
                    </div>
                </section>

                <div class="download-section">
                    <button id="exportPdf" class="download-btn">
                        <i class="fas fa-file-pdf"></i> Export as PDF
                    </button>
                    <div class="file-info">
                        <p><i class="fas fa-info-circle"></i> All changes auto-save to resume-data.json</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>© <span id="currentYear"></span> <span class="editable" data-field="footerName">Resume</span></p>
            <p class="footer-note">Auto-saving to JSON file</p>
        </footer>
    </template>

    <!-- Item Templates -->
    <template id="summaryParagraphTemplate">
        <p class="editable summary-paragraph" data-field="summaryParagraph-{{index}}">New summary paragraph</p>
    </template>

    <template id="experienceItemTemplate">
        <div class="experience-item" data-index="{{index}}">
            <div class="job-header">
                <h3 class="editable" data-field="company-{{index}}">New Company</h3>
                <div class="job-date">
                    <span class="editable" data-field="startDate-{{index}}">MM/YYYY</span> - 
                    <span class="editable" data-field="endDate-{{index}}">MM/YYYY</span>
                </div>
            </div>
            <p class="job-position">
                <span class="editable" data-field="position-{{index}}">Position</span> | 
                <span class="editable" data-field="jobLocation-{{index}}">Location</span>
            </p>
            <ul class="job-responsibilities" data-field="responsibilities-{{index}}">
                <li class="editable responsibility-item" data-item="0">Responsibility 1</li>
            </ul>
            <div class="item-actions">
                <button class="action-btn add-responsibility" data-add="responsibility-{{index}}">
                    <i class="fas fa-plus"></i> Add Responsibility
                </button>
                <button class="action-btn delete-item" data-delete="experience-{{index}}">
                    <i class="fas fa-trash"></i> Remove Job
                </button>
            </div>
        </div>
    </template>

    <template id="responsibilityTemplate">
        <li class="editable responsibility-item" data-item="{{itemIndex}}">New Responsibility</li>
    </template>

    <template id="skillCategoryTemplate">
        <div class="skill-category" data-index="{{index}}">
            <h4 class="editable" data-field="category-{{index}}">New Category</h4>
            <div class="skill-list" data-field="skills-{{index}}">
                <span class="skill-tag editable" data-skill="0">New Skill</span>
            </div>
            <div class="item-actions">
                <button class="action-btn add-skill" data-add="skill-{{index}}">
                    <i class="fas fa-plus"></i> Add Skill
                </button>
                <button class="action-btn delete-item" data-delete="category-{{index}}">
                    <i class="fas fa-trash"></i> Remove Category
                </button>
            </div>
        </div>
    </template>

    <template id="skillTagTemplate">
        <span class="skill-tag editable" data-skill="{{skillIndex}}">New Skill</span>
    </template>

    <template id="languageItemTemplate">
        <div class="language-item" data-index="{{index}}">
            <span class="language-name editable" data-field="language-{{index}}">Language</span>
            <span class="language-level editable" data-field="level-{{index}}">Level</span>
            <button class="delete-btn small" data-delete="language-{{index}}">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </template>

    <template id="educationItemTemplate">
        <div class="education-item" data-index="{{index}}">
            <h4 class="editable" data-field="degree-{{index}}">Degree</h4>
            <p class="education-detail editable" data-field="institution-{{index}}">Institution</p>
            <p class="education-date editable" data-field="educationDate-{{index}}">Date</p>
            <button class="delete-btn small" data-delete="education-{{index}}">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </template>

    <template id="personalDetailTemplate">
        <div class="personal-detail" data-index="{{index}}">
            <p>
                <strong class="editable" data-field="detailLabel-{{index}}">Label:</strong>
                <span class="editable" data-field="detailValue-{{index}}">Value</span>
            </p>
            <button class="delete-btn small" data-delete="personal-{{index}}">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </template>

    <script src="resume-editor.js"></script>
</body>
</html>
