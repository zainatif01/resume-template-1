<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zain Atif - Professional Resume</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="resume-container" id="resume-content" style="opacity: 0;">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <div class="name-title">
                    <h1 id="resume-name">Loading...</h1>
                    <p class="subtitle" id="resume-title">Loading...</p>
                </div>
                <div class="contact-info" id="contact-info">
                    <!-- Contact info will be populated by JavaScript -->
                </div>
            </div>
        </header>

        <main class="resume-content">
            <div class="main-column">
                <!-- Professional Summary -->
                <section class="section">
                    <h2 class="section-title">Professional Summary</h2>
                    <p class="summary-text" id="summary-text">
                        Loading...
                    </p>
                </section>

                <!-- Work History -->
                <section class="section">
                    <h2 class="section-title">Work History</h2>
                    <div id="work-experience">
                        <!-- Work experience will be populated by JavaScript -->
                    </div>
                </section>

                <!-- Skills -->
                <section class="section">
                    <h2 class="section-title">Skills</h2>
                    <div class="skills-grid" id="skills-section">
                        <!-- Skills will be populated by JavaScript -->
                    </div>
                </section>
            </div>

            <div class="sidebar">
                <!-- Languages -->
                <section class="sidebar-section">
                    <h3 class="sidebar-title">Languages</h3>
                    <div id="languages-list">
                        <!-- Languages will be populated by JavaScript -->
                    </div>
                </section>

                <!-- Education -->
                <section class="sidebar-section">
                    <h3 class="sidebar-title">Education</h3>
                    <div id="education-list">
                        <!-- Education will be populated by JavaScript -->
                    </div>
                </section>

                <!-- Personal Details -->
                <section class="sidebar-section">
                    <h3 class="sidebar-title">Personal Details</h3>
                    <div class="personal-detail" id="personal-details">
                        <!-- Personal details will be populated by JavaScript -->
                    </div>
                </section>

                <!-- Download Button -->
                <div class="download-section">
                    <a href="Zain_Atif_Resume.pdf" class="download-btn" download>
                        <i class="fas fa-download"></i> Download PDF Resume
                    </a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p id="footer-text">© 2024 Zain Atif. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js?v=1.0"></script>
</body>
</html>
